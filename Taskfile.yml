version: "3"

vars:
  GREETING: Hello, World!
  PROJECT: ASYNC-ETL-LIB

tasks:
  default:
    cmds:
      - task: help
    silent: true

  help:
    cmds:
      - echo {{.PROJECT}} " - " {{.GREETING}}
      - echo "Tasks available install, bump-version, publish-package, publish"

  install:
    desc: "Install root dependencies"
    cmds:
      - pnpm install

  build:
    desc: "Build the project"
    cmds:
      - pnpm run build

  bump-version:
    desc: "Bump iam-lib version (patch, minor, or major)"
    vars:
      TYPE: '{{default "patch" .TYPE}}'
    cmds:
      - |
        echo "🔍 Reading current version..."
        cd ../ASYNC-ETL-LIB
        CURRENT_VERSION=$(node -p "require('./package.json').version")
        echo "Current version: $CURRENT_VERSION"

        echo "🚀 Bumping {{.TYPE}} version..."
        npm version {{.TYPE}} --no-git-tag-version > /dev/null

        NEW_VERSION=$(node -p "require('./package.json').version")
        echo "✅ iam-lib version updated: $CURRENT_VERSION → $NEW_VERSION"

  publish-package:
    desc: "Publish ASYNC-ETL-LIB to npm registry"
    cmds:
      - |
        echo "Publishing ASYNC-ETL-LIB"
        (cd ../ASYNC-ETL-LIB && pnpm publish)

  publish:
    desc: "Bump iam-lib version and publish to npm registry"
    vars:
      TYPE: '{{default "patch" .TYPE}}'
    cmds:
      - task: bump-version
        vars:
          TYPE: "{{.TYPE}}"
      - task: publish-package

  ci:
    desc: "Run CI tasks: install, build, test"
    cmds:
      - task: install
      - task: build
      - echo "Starting CI tasks..."
      - echo "Uploading coverage reports..."
      - codecov --token=${{ secrets.CODECOV_TOKEN }}
      - cmd: pnpm test:coverage
    env:
      CI: "true"
      NODE_AUTH_TOKEN: "${{secrets.GITHUB_TOKEN}}"
      GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
